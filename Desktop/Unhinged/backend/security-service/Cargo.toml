[package]
name = "unhinged-security"
version = "0.1.0"
edition = "2021"
description = "High-level production-grade security components for UNHINGED platform"
authors = ["Aryan Arora"]
license = "MIT"
repository = "https://github.com/your-username/unhinged"

[dependencies]
# Cryptography
bcrypt = "0.13"
jsonwebtoken = { version = "9.0", features = ["ring"] }
ring = "0.17"
aes-gcm = { version = "0.10", features = ["rand"] }
rand = "0.8"

# Validation
validator = { version = "0.16", features = ["serde"] }

# Web framework
actix-web = "4.0"
actix-rt = "2.0"

# Configuration
config = "0.14"

# Logging
log = "0.4"
env_logger = "0.10"

# Database connectivity (if needed)
sqlite = { version = "0.33", features = ["bundled"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-async-tokio-native-tls", "macros"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"

# Development dependencies
[dev-dependencies]
tokio = { version = "1", features = ["full"] }
assert_json_diff = "1.0"
serial_test = "2.0"