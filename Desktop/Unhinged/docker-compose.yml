version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/unhinged
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VAULT_PATH=./vault
      - EXPORT_DIR=./exports
      - RAG_SERVICE_URL=http://rag-service:8001
    volumes:
      - ./backend/vault:/app/vault
      - ./backend/exports:/app/exports
      - ./backend/services:/app/services
      - ./backend/agents:/app/agents
    depends_on:
      - postgres
      - redis

  # Frontend
  frontend:
    build: ./unhinged-web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    volumes:
      - ./unhinged-web/src:/app/src
      - ./unhinged-web/public:/app/public

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=unhinged
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MinIO Object Storage (for file uploads)
  minio:
    image: quay.io/minio/minio
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  # RAG Service
  rag-service:
    build: ./backend/services/rag-service
    ports:
      - "8001:8001"
    environment:
      - VAULT_PATH=./vault
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend/vault:/app/vault
      - chroma_db_data:/app/chroma_db
    depends_on:
      - backend

  # Security Service
  security-service:
    build: ./backend/security-service
    ports:
      - "8002:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret-change-in-production-32-bytes}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-3600}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - ./backend/security-service:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  chroma_db_data: