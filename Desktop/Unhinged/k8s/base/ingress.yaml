apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unhinged-ingress
  namespace: unhinged
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.unhinged.example.com
        - app.unhinged.example.com
      secretName: unhinged-tls
  rules:
    - host: api.unhinged.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unhinged-backend
                port:
                  number: 80
    - host: app.unhinged.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unhinged-frontend
                port:
                  number: 80