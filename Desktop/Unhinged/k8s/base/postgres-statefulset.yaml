apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unhinged-postgres
  namespace: unhinged
  labels:
    app: unhinged-postgres
spec:
  serviceName: "unhinged-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: unhinged-postgres
  template:
    metadata:
      labels:
        app: unhinged-postgres
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: unhinged
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unhinged-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: unhinged-postgres
  namespace: unhinged
  labels:
    app: unhinged-postgres
spec:
  selector:
    app: unhinged-postgres
  ports:
    - port: 5432
      targetPort: postgres
  clusterIP: None
  type: ClusterIP