apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unhinged-backend-network-policy
  namespace: unhinged
spec:
  podSelector:
    matchLabels:
      app: unhinged-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: unhinged-frontend
        - namespaceSelector:
            matchLabels:
              name: unhinged
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              app: unhinged-postgres
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app: unhinged-redis
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: unhinged-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: unhinged-redis
      ports:
        - protocol: TCP
          port: 6379
    - to: []  # Allow DNS
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unhinged-frontend-network-policy
  namespace: unhinged
spec:
  podSelector:
    matchLabels:
      app: unhinged-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []  # Allow all ingress for now (can be restricted based on IP ranges in production)
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: unhinged-backend
      ports:
        - protocol: TCP
          port: 3000
    - to: []  # Allow DNS
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53