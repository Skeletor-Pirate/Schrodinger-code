apiVersion: apps/v1
kind: Deployment
metadata:
  name: unhinged-frontend
  namespace: unhinged
  labels:
    app: unhinged-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unhinged-frontend
  template:
    metadata:
      labels:
        app: unhinged-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: unhinged-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.unhinged.example.com"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /_next/data/build-manifest.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_next/data/build-manifest.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: unhinged-frontend
  namespace: unhinged
  labels:
    app: unhinged-frontend
spec:
  selector:
    app: unhinged-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP