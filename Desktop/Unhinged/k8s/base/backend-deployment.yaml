apiVersion: apps/v1
kind: Deployment
metadata:
  name: unhinged-backend
  namespace: unhinged
  labels:
    app: unhinged-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: unhinged-backend
  template:
    metadata:
      labels:
        app: unhinged-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: unhinged-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: unhinged-config
            - secretRef:
                name: unhinged-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: unhinged-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: unhinged-secrets
                  key: REDIS_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unhinged-secrets
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: vault-storage
              mountPath: /app/vault
            - name: export-storage
              mountPath: /app/exports
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: vault-storage
          persistentVolumeClaim:
            claimName: unhinged-vault-pvc
        - name: export-storage
          persistentVolumeClaim:
            claimName: unhinged-export-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: unhinged-backend
  namespace: unhinged
  labels:
    app: unhinged-backend
spec:
  selector:
    app: unhinged-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP