apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unhinged-backend-hpa
  namespace: unhinged
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unhinged-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unhinged-frontend-hpa
  namespace: unhinged
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unhinged-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70