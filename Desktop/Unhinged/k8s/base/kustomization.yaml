resources:
  - namespace.yaml
  - storage-pvc.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policies.yaml

configMapGenerator:
  - name: unhinged-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - VAULT_PATH=/app/vault
      - EXPORT_DIR=/app/exports

secretGenerator:
  - name: unhinged-secrets
    type: Opaque
    behavior: merge
    literals:
      - DATABASE_URL=postgresql://postgres:postgres@unhinged-postgres.unhinged.svc.cluster.local:5432/unhinged
      - REDIS_URL=redis://unhinged-redis.unhinged.svc.cluster.local:6379
      - POSTGRES_PASSWORD=changeme-in-production
      - OPENAI_API_KEY=your-openai-api-key-here
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

generatorOptions:
  disableNameSuffixHash: true